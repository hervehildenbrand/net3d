name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Showcase telemetry simulator tests
        run: node --test showcase/telemetry-sim/model.test.mjs showcase/telemetry-sim/sim.test.mjs

      - name: Showcase port-planner tests
        run: python3 showcase/seed/test_circuit_ports.py

      - name: Production build
        run: pnpm build
